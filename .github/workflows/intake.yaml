name: Intake

# Pull requests run every check; only a merge to main publishes.
on:
  pull_request:
    paths: ["data/*.yaml"]
  push:
    branches: [main]
    paths: ["data/*.yaml"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: intake-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SYFT_VERSION: v1.57.2
  GRYPE_VERSION: v0.122.1

jobs:
  intake:
    runs-on: self-hosted
    env:
      MAVEN_REMOTE_URL: "https://repo.maven.apache.org/maven2"
      POLICY_FAIL_ON: critical
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --no-dev

      - name: Install Syft and Grype
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_VERSION/install.sh" | sh -s -- -b "$RUNNER_TEMP/bin" "$SYFT_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/$GRYPE_VERSION/install.sh" | sh -s -- -b "$RUNNER_TEMP/bin" "$GRYPE_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Extract added entries
        id: extract
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: uv run oss-allowlist extract --base "$BASE"

      - name: Fetch
        if: steps.extract.outputs.count != '0'
        run: uv run oss-allowlist fetch added.json

      - name: Verify digests
        if: steps.extract.outputs.count != '0'
        run: uv run oss-allowlist verify

      - name: Generate SBOMs
        if: steps.extract.outputs.count != '0'
        run: uv run oss-allowlist sbom

      - name: Scan vulnerabilities
        if: steps.extract.outputs.count != '0'
        run: uv run oss-allowlist vuln

      - name: Enforce policy
        if: steps.extract.outputs.count != '0'
        run: uv run oss-allowlist policy

      - name: Upload reports
        if: always() && steps.extract.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: intake-reports
          path: |
            added.json
            dist/manifest.json
            dist/reports/

      - name: Publish
        if: github.event_name == 'push' && steps.extract.outputs.count != '0'
        env:
          JFROG_PYPI_URL: ${{ vars.JFROG_PYPI_URL }}
          JFROG_MAVEN_URL: ${{ vars.JFROG_MAVEN_URL }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: uv run oss-allowlist publish

      - name: Comment on PR failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "❌ Intake failed. See [the run]($RUN_URL)."
