[project]
name = "oss-allowlist"
version = "0.2.0"
description = "PR-driven intake pipeline for Python/Maven artifacts with SBOM, CVE scan, digest verification, and publish to JFrog/S3."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "boto3>=1.29,<2.0",
    "twine>=4.0,<8.0",
]

[project.scripts]
oss-allowlist = "oss_allowlist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.5",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_allowlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oss_allowlist"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
