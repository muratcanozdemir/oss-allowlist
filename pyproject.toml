[project]
name = "oss-allowlist"
version = "0.1.0"
description = "PR-driven intake pipeline for Python/Maven artifacts with SBOM, CVE scan, SHA256 verification, and publish to JFrog/S3."
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.12"

# Dependencies
dependencies = [
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "boto3>=1.29,<2.0",
    "twine>=4.0,<8.0",
]
optional-dependencies = { dev = ["pytest>=7.0", "black>=23.0", "mypy>=1.5"] }

[project.scripts]
extract-added = "scripts.extract_added:main"
intake = "scripts.intake:main"
fetch = "scripts.fetch:main"
verify = "scripts.verify:main"
sbom = "scripts.sbom:main"
vuln = "scripts.vuln:main"
policy = "scripts.policy:main"
publish = "scripts.publish:main"


[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

